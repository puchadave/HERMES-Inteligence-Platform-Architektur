http:
  middlewares:
    odysseus-auth:
      forwardAuth:
        address: http://oauth2-proxy:4180/oauth2/auth
        trustForwardHeader: true
        authResponseHeaders:
          - X-Auth-Request-User
          - X-Auth-Request-Email
          - X-Auth-Request-Groups
          - X-Auth-Request-Access-Token

    odysseus-auth-errors:
      errors:
        status:
          - "401-403"
        service: oauth2-proxy-service
        query: /oauth2/sign_in?rd={url}

    odysseus-auth-chain:
      chain:
        middlewares:
          - odysseus-auth-errors
          - odysseus-auth

    odysseus-strip-prefix:
      stripPrefix:
        prefixes:
          - /odysseus

  services:
    oauth2-proxy-service:
      loadBalancer:
        servers:
          - url: http://oauth2-proxy:4180
