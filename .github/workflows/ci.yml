name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e 'services/odysseus-api[test]' -e clients/edge-cli
      - name: Prepare configuration
        run: |
          cp .env.example .env
          ./scripts/bootstrap.sh
      - name: Run tests
        run: pytest services/odysseus-api/tests clients/edge-cli/tests -q
      - name: Validate Compose
        run: docker compose --profile core --profile vpn --profile xeon --profile observability config >/dev/null
      - name: Build project images
        run: docker compose --profile core build searxng odysseus-api
