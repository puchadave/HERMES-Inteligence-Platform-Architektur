name: CI
on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e 'services/odysseus-api[test]' -e clients/edge-cli -e 'services/osint-worker[test]'
      - name: Prepare configuration
        run: |
          cp .env.example .env
          ./scripts/bootstrap.sh
      - name: Run tests
        run: pytest services/odysseus-api/tests clients/edge-cli/tests services/osint-worker/tests -q
      - name: Compile Python services
        run: python -m compileall -q services/odysseus-api/app services/osint-worker/app clients/edge-cli/odysseus_edge
      - name: Verify committed source SBOM
        run: |
          python scripts/generate-source-sbom.py
          git diff --exit-code -- sbom/odysseus-source.cyclonedx.json sbom/odysseus-source.spdx.json
      - name: Validate core Compose
        run: docker compose --profile core --profile vpn --profile xeon --profile observability config >/dev/null
      - name: Validate research Compose
        run: docker compose -f compose.yaml -f compose.research.yaml --profile core --profile research config >/dev/null
      - name: Build project images
        run: |
          docker compose --profile core build searxng odysseus-api
          docker compose -f compose.yaml -f compose.research.yaml --profile research build osint-worker openosint-mcp
