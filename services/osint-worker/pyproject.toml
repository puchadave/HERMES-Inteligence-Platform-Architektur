[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "odysseus-osint-worker"
version = "0.2.0"
description = "NATS-driven MCP and BBOT research worker for Odysseus"
requires-python = ">=3.12"
dependencies = [
  "bbot==2.7.2",
  "httpx==0.28.1",
  "nats-py==2.11.0",
  "pydantic==2.11.7",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
